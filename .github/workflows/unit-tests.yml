name: Unit tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  unit:
    name: API typecheck + unit tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Typecheck API
        run: pnpm --filter tidarr-api exec tsc --noEmit -p tsconfig.json

      - name: Run unit tests
        run: pnpm test

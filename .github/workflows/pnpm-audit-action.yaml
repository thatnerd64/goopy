name: Pnpm-Audit
on:
  push:
    branches: [ main ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # Single root pnpm-lock.yaml covers all workspaces (api, app, e2e)
      # GHSA-vfj7-8cjw-p6xm (braces DoS) has no patched release and is only
      # reached through ts-prune, a dev-only dead-code finder
      - name: Run audit
        run: npx --yes audit-ci@^7 --moderate --package-manager pnpm --allowlist GHSA-vfj7-8cjw-p6xm

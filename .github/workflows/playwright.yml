name: Playwright Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: "Regenerate the screenshot baselines and upload them as an artifact"
        type: boolean
        default: false

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    name: "Playwright Tests"
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm --filter tidarr-testing exec playwright install --with-deps chromium

      - name: Run Playwright tests
        env:
          CI: true
        run: pnpm --filter tidarr-testing ${{ inputs.update_snapshots && 'playwright:test-update-snapshots' || 'playwright:test' }}

      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.update_snapshots }}
        with:
          name: playwright-snapshots
          path: ./e2e/snapshots/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: ./e2e/playwright-report/
          retention-days: 30
